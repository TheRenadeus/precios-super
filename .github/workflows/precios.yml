name: Actualizar precios

on:
  schedule:
    # Todos los días, cerca de las 8:15 hora de Chile (UTC-3).
    - cron: '13 11 * * *'
  workflow_dispatch:
    inputs:
      tiendas:
        description: "Tiendas a leer, separadas por espacio (vacío = todas las de la tarea diaria)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tottus bloquea a los programas que se identifican como robot: queda fuera (ver README).
      # Easy responde 403 a los servidores de GitHub (desde un computador sí responde): no va aquí.
      # El nombre de las tiendas viene por variable de entorno, nunca pegado en el comando.
      - name: Leer precios de supermercados y ferreterías
        env:
          TIENDAS: ${{ inputs.tiendas }}
        run: node scripts/update-prices.mjs ${TIENDAS:-jumbo santaisabel unimarc acuenta alvi centralmayorista sodimac}

      - name: Subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar precios del día"
          # La tarea del dólar también sube cambios: si llegó antes, se integra y se reintenta.
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
