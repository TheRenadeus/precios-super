name: Actualizar precios

on:
  schedule:
    # Todos los días, cerca de las 8:15 hora de Chile (UTC-3).
    - cron: '13 11 * * *'
    # Respaldo: GitHub a veces se salta una ejecución programada (pasó el 27-nov). Si ya se leyó hoy, no hace nada.
    - cron: '43 13 * * *'
    - cron: '13 17 * * *'
  workflow_dispatch:
    inputs:
      tiendas:
        description: "Tiendas a leer, separadas por espacio (vacío = todas las de la tarea diaria)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # En las ejecuciones programadas de respaldo: si Jumbo ya tiene los precios de hoy, no vuelve a leer las tiendas.
      - name: ¿Ya se leyó hoy?
        id: hoy
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          hoy=$(TZ=America/Santiago date +%F)
          if [ "$EVENTO" = schedule ] && node -e "process.exit(require('./data/jumbo.json').fecha === process.argv[1] ? 0 : 1)" "$hoy"; then
            echo "Ya están los precios de $hoy."
            echo "listo=1" >> "$GITHUB_OUTPUT"
          fi

      # Tottus responde 403 a los servidores de GitHub: se lee desde un computador (scripts/precios-local.mjs, ver README).
      # Easy responde 403 a los servidores de GitHub (desde un computador sí responde): no va aquí.
      # El nombre de las tiendas viene por variable de entorno, nunca pegado en el comando.
      - name: Leer precios de supermercados y ferreterías
        if: steps.hoy.outputs.listo != '1'
        env:
          TIENDAS: ${{ inputs.tiendas }}
        run: node scripts/update-prices.mjs ${TIENDAS:-jumbo santaisabel unimarc acuenta alvi centralmayorista sodimac}

      - name: Subir cambios
        if: steps.hoy.outputs.listo != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar precios del día"
          # Si otra tarea (aportes) subió cambios antes, se integra y se reintenta.
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
